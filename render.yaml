# Render Blueprint: New > Blueprint > point at this repo. Fill the secret env vars in the dashboard.
services:
  - type: web
    name: census-assistant
    runtime: docker
    plan: starter          # free plan sleeps after inactivity; starter stays warm for reviewers
    healthCheckPath: /healthz
    # Conversations, result tables and long-term memories live in SQLite on this disk, so they
    # survive deploys and restarts. (A disk pins the service to one instance and adds a few
    # seconds of downtime per deploy; fine for this app, which is single-instance anyway.)
    disk:
      name: state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        value: CENSUS_APP
      - key: SNOWFLAKE_PRIVATE_KEY_PEM
        sync: false
      - key: SNOWFLAKE_ROLE
        value: CENSUS_READER
      - key: SNOWFLAKE_WAREHOUSE
        value: CENSUS_WH
      - key: SNOWFLAKE_DATABASE
        value: US_OPEN_CENSUS_DATA_NEIGHBORHOOD_INSIGHTS_FREE_DATASET
      - key: CENSUS_YEARS
        value: "2019,2020"
      # Measured on Render via /healthz: Cloudflare and Render's load balancer each append to
      # X-Forwarded-For, so the visitor's IP is the 2nd entry from the right.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: STATE_DB_PATH
        value: /var/data/state.db
      - key: BASIC_AUTH_USER
        value: reviewer
      - key: BASIC_AUTH_PASSWORD
        sync: false
